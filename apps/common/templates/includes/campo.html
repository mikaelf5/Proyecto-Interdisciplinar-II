{# Uso: {% include "includes/campo.html" with campo=form.motivo etiqueta="Motivo" %} #}
<div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ etiqueta|default:campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text }}</div>{% endif %}
    {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
</div>
