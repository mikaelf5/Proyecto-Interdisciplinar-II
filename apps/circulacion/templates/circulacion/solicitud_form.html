{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Nueva solicitud de préstamo</h2>

    <hr>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Registrar solicitud
        </button>

        <a href="{% url 'circulacion:solicitudes' %}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
