{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-sm-10 col-md-6 col-lg-4">
<div class="card p-4 mt-4">
    <h1 class="h4 mb-3">Cambiar contraseña</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for campo in form %}
            <div class="mb-3">
                <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
                <input type="password" name="{{ campo.html_name }}" id="{{ campo.id_for_label }}" class="form-control">
                {% for error in campo.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
            </div>
        {% endfor %}
        <button class="btn btn-primary w-100">Cambiar</button>
    </form>
</div></div></div>
{% endblock %}
