{% extends "base.html" %}
{% block title %}Registrar ítem{% endblock %}

{% block content %}
<h1 class="h3 mb-1">Registrar ítem</h1>
<p class="text-muted mb-3">Categoría {{ categoria.nombre }}. Los campos dependen de los atributos de la categoría.</p>

<div class="card p-4" style="max-width: 640px;">
    <form method="post" novalidate>
        {% csrf_token %}
        {% include "catalogo/_campos.html" %}
        <button type="submit" class="btn btn-primary">Registrar ítem</button>
        <a href="{% url 'catalogo_web:categorias' %}" class="btn btn-link">Cancelar</a>
    </form>
</div>
{% endblock %}
