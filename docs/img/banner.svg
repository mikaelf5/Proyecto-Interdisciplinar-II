<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.6" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#fondo)"/>
  <rect width="1280" height="400" rx="20" fill="url(#brillo)"/>
  <rect width="1280" height="400" rx="20" fill="url(#puntos)"/>

  <!-- Texto -->
  <g transform="translate(80,0)">
    <rect x="0" y="92" width="196" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.1" stroke="#A5B4FC" stroke-opacity="0.5"/>
    <text x="98" y="112" text-anchor="middle" font-size="13" font-weight="600" fill="#C7D2FE" letter-spacing="1.5">TI2 · UNSA · 2026</text>

    <text x="0" y="186" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Sistema de</text>
    <text x="0" y="248" font-size="58" font-weight="800" fill="#A5B4FC" letter-spacing="-1">Préstamos</text>

    <text x="2" y="292" font-size="19" fill="#CBD5E1">Equipos, libros e indumentaria de la escuela,</text>
    <text x="2" y="318" font-size="19" fill="#CBD5E1">de la reserva a la devolución.</text>
  </g>

  <!-- Tarjetas de recursos -->
  <g filter="url(#sombra)">
    <!-- Equipos -->
    <g transform="translate(760,70) rotate(-6)">
      <rect width="170" height="200" rx="18" fill="#FFFFFF"/>
      <rect x="20" y="22" width="130" height="96" rx="12" fill="#EEF2FF"/>
      <rect x="45" y="45" width="80" height="50" rx="4" fill="none" stroke="#4F46E5" stroke-width="5"/>
      <path d="M35 102 H135" stroke="#4F46E5" stroke-width="6" stroke-linecap="round"/>
      <text x="20" y="148" font-size="18" font-weight="700" fill="#0F172A">Equipos</text>
      <rect x="20" y="162" width="74" height="22" rx="11" fill="#FEF3C7"/>
      <text x="57" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#B45309">ESPECIAL</text>
    </g>
    <!-- Libros -->
    <g transform="translate(930,120) rotate(4)">
      <rect width="170" height="200" rx="18" fill="#FFFFFF"/>
      <rect x="20" y="22" width="130" height="96" rx="12" fill="#ECFDF5"/>
      <rect x="50" y="40" width="20" height="62" rx="3" fill="#059669"/>
      <rect x="74" y="44" width="18" height="58" rx="3" fill="#10B981"/>
      <rect x="96" y="38" width="22" height="64" rx="3" fill="#047857" transform="rotate(10 107 70)"/>
      <text x="20" y="148" font-size="18" font-weight="700" fill="#0F172A">Libros</text>
      <rect x="20" y="162" width="88" height="22" rx="11" fill="#DCFCE7"/>
      <text x="64" y="177" text-anchor="middle" font-size="11" font-weight="700" fill="#15803D">DISPONIBLE</text>
    </g>
    <!-- Indumentaria -->
    <g transform="translate(1080,60) rotate(-3)">
      <rect width="150" height="190" rx="18" fill="#FFFFFF"/>
      <rect x="18" y="20" width="114" height="90" rx="12" fill="#FDF2F8"/>
      <path d="M58 38 L48 44 L36 58 L46 68 L52 62 L52 96 L98 96 L98 62 L104 68 L114 58 L102 44 L92 38 Q75 50 58 38 Z" fill="#DB2777"/>
      <text x="18" y="140" font-size="17" font-weight="700" fill="#0F172A">Indumentaria</text>
      <rect x="18" y="154" width="80" height="22" rx="11" fill="#E0E7FF"/>
      <text x="58" y="169" text-anchor="middle" font-size="11" font-weight="700" fill="#4338CA">PRESTADO</text>
    </g>
  </g>

  <!-- Línea de proceso -->
  <g transform="translate(760,345)" font-size="13" font-weight="600" fill="#C7D2FE">
    <path d="M8 0 H460" stroke="#A5B4FC" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="4 6"/>
    <g fill="#A5B4FC"><circle cx="8" cy="0" r="6"/><circle cx="160" cy="0" r="6"/><circle cx="312" cy="0" r="6"/><circle cx="460" cy="0" r="6"/></g>
    <text x="8" y="26" text-anchor="start">Reserva</text>
    <text x="160" y="26" text-anchor="middle">Entrega</text>
    <text x="312" y="26" text-anchor="middle">Renovación</text>
    <text x="460" y="26" text-anchor="end">Devolución</text>
  </g>
</svg>
